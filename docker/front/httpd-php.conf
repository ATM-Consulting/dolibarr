<VirtualHost *:80>
    DocumentRoot "/var/www/html/htdocs"
    DirectoryIndex index.php index.html

    <Directory "/var/www/html/htdocs">
        Require all granted
        AllowOverride All
        Options Indexes FollowSymLinks

        # Ne pas passer les fichiers statiques par PHP-FPM
        <FilesMatch "\.(svg|jpg|jpeg|png|gif|css|js|ico|txt|html)$">
            SetHandler None
        </FilesMatch>

        # Rediriger les fichiers PHP vers PHP-FPM
        <FilesMatch "\.php$">
            SetHandler "proxy:fcgi://php:9000"
        </FilesMatch>
    </Directory>

    # Configuration pour les fichiers PHP
    ProxyPassMatch "^/(.*\.php(/.*)?)$" "fcgi://php:9000/var/www/htdocs/$1"
</VirtualHost>
